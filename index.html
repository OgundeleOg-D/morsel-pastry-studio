lowing down for.','Shop pastries →','all'],['assets/morsel-celebration-editorial.jpg','CELEBRATIONS','Make the moment sweeter.','Explore cakes →','cakes'],['assets/morsel-sweet-treats-editorial.jpg','SWEET TREATS','Small indulgences, beautifully made.','Explore treats →','cookies'],['assets/morsel-bakery-craft.jpg','THE STUDIO','Made carefully, every morning.','Our story →','story']].map((x,i)=>`<article class="motion-card"><img src="${x[0]}" alt="Morsel ${esc(x[1])}"><div class="motion-card-copy"><small>${x[1]}</small><h3>${x[2]}</h3><button onclick="${x[4]==='story'?'go(\'story\')':`shop('${x[4]}')`} ">${x[3]}</button></div></article>`).join('')}</div></div><div class="motion-progress"><div class="motion-progress-line"><i style="transform:translateX(${state.promoIndex*100}%)"></i></div><span class="motion-count">0${state.promoIndex+1} / 04</span></div></section><section class="statement"><div class="statement-inner"><div class="statement-brand"><img src="assets/morsel-logo-light.svg" alt="Morsel Pastry Studio"></div><div><div class="eyebrow">A LITTLE MORE THAN A BAKERY</div><h2>Good pastry is a small kind of luxury.</h2></div><p>We make familiar things beautifully — with patient hands, generous butter and an eye for the little details.</p><button class="light" onclick="go('story')">Our story →</button></div></section><section class="editorial-feature celebration"><div class="editorial-image"><img src="assets/morsel-celebration-editorial.jpg" alt="Morsel celebration cake"></div><div class="editorial-copy"><div class="eyebrow"><i></i> CELEBRATIONS</div><h2>The cake is part of the memory.</h2><p>From quiet birthdays to big rooms full of people, our celebration cakes are made to feel like yours.</p><button class="solid large" onclick="shop('cakes')">Explore cakes →</button></div></section><section class="editorial-feature sweet editorial-reverse"><div class="editorial-copy"><div class="eyebrow"><i></i> SWEET THINGS</div><h2>A little indulgence goes a long way.</h2><p> function filtered(){let l=products;if(state.cat!=='all')l=l.filter(p=>p.cat===state.cat);let q=state.search.trim().toLowerCase();if(q)l=l.filter(p=>(p.name+' '+p.desc+' '+CATS.find(c=>c.id===p.cat).label).toLowerCase().includes(q));return l}
function cartCount(){return Object.values(state.cart).reduce((n,x)=>n+x.qty,0)}function num(p){return Number(p.price.replace(/[^0-9]/g,''))||0}

function modal(){if(!state.selected)return '';let p=state.selected;return `<div class="overlay" id="modal"><div class="modal"><button class="close" onclick="closeAll()">×</button><div class="modal-media">${art(p)}</div><div class="modal-copy"><div class="eyebrow"><i></i> ${CATS.find(c=>c.id===p.cat).label}</div><h2>${p.name}</h2><p>${p.desc}</p><div class="price">${p.price}</div><div class="controls"><div class="stepper"><button id="modalMinus">−</button><span id="modalQty">1</span><button id="modalPlus">+</button></div><button class="solid large add-wide" id="modalAdd">Add to bag</button></div></div></div></div>`}
function drawer(){let items=Object.values(state.cart),sub=items.reduce((s,x)=>s+num(x)*x.qty,0);return `<div class="overlay drawer-overlay" id="drawer"><aside class="drawer"><div class="drawer-head"><div><div class="eyebrow">YOUR BAG</div><h2>${state.checkout?'Order received':'Freshly chosen.'}</h2></div><button class="close" onclick="closeAll()">×</button></div>${state.checkout?`<div class="success"><div class="success-mark">✓</div><h3>Thank you.</h3><p>Your Morsel order has been received. We'll be in touch with the next steps for pickup.</p><button class="outline large" onclick="state.checkout=false;closeAll()">Continue shopping</button></div>`:!items.length?`<div class="cart-empty"><div class="empty-mark">M.</div><h3>Your bag is quiet.</h3><p>Add something beautiful from the catalogue.</p><button class="solid large" onclick="closeAll()">Browse pastries</button></div>`:`<div class="cart-items">${items.map(x=>`<div class="cart-item"><div class="thumb">${art(x)}</div><div class="cart-info"><h3>${x.name}</h3><strong>${x.price}</strong><div class="cart-row"><div class="stepper small"><button onclick="qty('${x.id}',-1)">−</button><span>${x.qty}</span><button onclick="qty('${x.id}',1)">+</button></div><button class="remove" onclick="remove('${x.id}')">Remove</button></div></div></div>`).join('')}</div><div class="cart-bottom"><div class="subtotal"><span>Subtotal</span><strong>₦${sub.toLocaleString()}</strong></div><p>Pickup and delivery details are confirmed after checkout.</p><button class="solid large checkout" onclick="state.checkout=true;state.cart={};render();$('#drawer').classList.add('open')">Checkout · ₦${sub.toLocaleString()}</button></div>`}</aside></div>`}
function searchOverlay(){let list=filtered();return `<div class="search-overlay" id="searchOverlay"><div class="search-panel"><div class="search-head"><div class="search-input"><span>⌕</span><input id="searchBox" value="${esc(state.search)}" placeholder="Search pastries, cakes, treats..." oninput="state.search=this.value;render();$('#searchOverlay').classList.add('open');setTimeout(()=>$('#searchBox').focus(),0)"></div><button onclick="closeAll()">×</button></div>${state.search.trim()?`<div class="search-results"><div class="eyebrow">${list.length} RESULT${list.length===1?'':'S'}</div>${list.map(p=>`<button class="search-result" onclick="openProduct('${p.id}');state.searchOpen=false;$('#searchOverlay').classList.remove('open')"><div class="thumb">${art(p)}</div><div><h3>${p.name}</h3><span>${CATS.find(c=>c.id===p.cat).label}</span></div><strong>${p.price}</strong></button>`).join('')}${!list.length?'<div class="empty">No pastries found.</div>':''}</div>`:`<div class="suggestions"><span>Try</span><button onclick="state.search='croissant';render();$('#searchOverlay').classList.add('open')">croissant</button><button onclick="state.search='cake';render();$('#searchOverlay').classList.add('open')">cake</button><button onclick="state.search='chocolate';render();$('#searchOverlay').classList.add('open')">chocolate</button><button onclick="state.search='pie';render();$('#searchOverlay').classList.add('open')">pie</button></div>`}</div></div>`}
function render(){let main=state.view==='home'?home():state.view==='shop'?shopView():state.view==='story'?story():events();document.getElementById('app').innerHTML=header()+main+footer()+modal()+drawer()+searchOverlay();if(state.selected)$('#modal').classList.add('open');if(state.cartOpen)$('#drawer').classList.add('open');if(state.searchOpen)$('#searchOverlay').classList.add('open');if(state.selected){let q=1;$('#modalMinus').onclick=()=>{$('#modalQty').textContent=Math.max(1,--q)};$('#modalPlus').onclick=()=>{$('#modalQty').textContent=++q};$('#modalAdd').onclick=()=>{add(state.selected.id,q);closeAll()}}startMotionTimers()}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});render();

</script>
</body></html>
